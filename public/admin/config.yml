      - { label: 'Portrait neben Willkommenstext (nur Startseite)', name: sideImage, widget: image, required: false }
      - { label: 'Alt-Text Portrait (nur Startseite)', name: sideAlt, widget: string, required: false }
      - label: 'Galerie Räume (nur „Über uns“)'
