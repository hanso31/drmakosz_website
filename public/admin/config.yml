        fields:
          - { label: Sprache, name: lang, widget: hidden, default: en }
          - { label: Praxisname (EN), name: practiceName, widget: string }
          - { label: Ärztin/Arzt, name: doctorName, widget: string }
          - { label: Fachgebiet (EN), name: specialty, widget: string }
          - { label: Strasse, name: street, widget: string }
          - { label: PLZ & Ort, name: zipCity, widget: string }
          - { label: Telefon, name: phone, widget: string }
          - { label: Mobil, name: phoneMobile, widget: string }
          - { label: Fax, name: fax, widget: string }
          - { label: E-Mail, name: email, widget: string }
          - label: Sprechstunden (EN)
            name: hours
            widget: list
            fields:
