# Decap CMS Konfiguration – dermatologe-basel.ch
# Backend: GitHub. Voraussetzung: OAuth-App bzw. Netlify-Identity-freier OAuth-Client.
# Siehe README.md → „Decap CMS einrichten“ für die komplette Anleitung.

backend:
  name: github
  repo: hanso31/drmakosz_website
  branch: main
  # OAuth über den quelloffenen decap-cms-oauth Provider (Cloudflare Worker).
  # Nach dem Einrichten die eigene URL eintragen (siehe README):
  base_url: https://decap-oauth.example.workers.dev

# Sprache der Admin-Oberfläche
locale: de

# Bilder landen in public/images und werden unter /images/... referenziert
media_folder: public/images
public_folder: /images

# Redaktioneller Workflow: Änderungen werden als Entwurf/Pull Request gespeichert
publish_mode: editorial_workflow

site_url: https://www.dermatologe-basel.ch
logo_url: /images/logo.svg

collections:
  # ---------------------------------------------------------------- Leistungen
  - name: leistungen-de
    label: Leistungen (Deutsch)
    label_singular: Leistung
    folder: src/content/leistungen/de
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Sprache, name: lang, widget: hidden, default: de }
      - { label: Titel, name: title, widget: string, hint: 'Name der Leistung, z. B. „Akne“' }
      - label: Kategorie
        name: category
        widget: select
        options:
          - { label: Erkrankungen, value: erkrankungen }
          - { label: Schönheit, value: schoenheit }
      - { label: Kurzbeschreibung (SEO), name: description, widget: text, hint: 'Wird in Google angezeigt. Max. ca. 160 Zeichen.' }
      - { label: Reihenfolge, name: order, widget: number, default: 99, hint: 'Position in der Übersicht (kleinere Zahl = weiter oben)' }
      - { label: Titelbild, name: heroImage, widget: image, required: false }
      - { label: Bild-Alt-Text, name: heroAlt, widget: string, required: false, hint: 'Beschreibt das Bild für Screenreader und Google' }
      - { label: Text, name: body, widget: markdown }

  - name: leistungen-en
    label: Leistungen (English)
    label_singular: Leistung (EN)
    folder: src/content/leistungen/en
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Sprache, name: lang, widget: hidden, default: en }
      - { label: Titel (EN), name: title, widget: string }
      - label: Kategorie
        name: category
        widget: select
        options:
          - { label: Erkrankungen, value: erkrankungen }
          - { label: Schönheit, value: schoenheit }
      - { label: Kurzbeschreibung (SEO, EN), name: description, widget: text }
      - { label: Reihenfolge, name: order, widget: number, default: 99 }
      - { label: Titelbild, name: heroImage, widget: image, required: false }
      - { label: Bild-Alt-Text (EN), name: heroAlt, widget: string, required: false }
      - { label: Text (EN), name: body, widget: markdown }

  - name: leistungen-fr
    label: Leistungen (Français)
    label_singular: Leistung (FR)
    folder: src/content/leistungen/fr
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Sprache, name: lang, widget: hidden, default: fr }
      - { label: Titel (FR), name: title, widget: string }
      - label: Kategorie
        name: category
        widget: select
        options:
          - { label: Erkrankungen, value: erkrankungen }
          - { label: Schönheit, value: schoenheit }
      - { label: Kurzbeschreibung (SEO, FR), name: description, widget: text }
      - { label: Reihenfolge, name: order, widget: number, default: 99 }
      - { label: Titelbild, name: heroImage, widget: image, required: false }
      - { label: Bild-Alt-Text (FR), name: heroAlt, widget: string, required: false }
      - { label: Text (FR), name: body, widget: markdown }

  # ------------------------------------------------------------------- Seiten
  - name: seiten-de
    label: Seiten (Deutsch)
    folder: src/content/pages/de
    create: false
    slug: '{{slug}}'
    fields:
      - { label: Sprache, name: lang, widget: hidden, default: de }
      - label: Seite
        name: pageId
        widget: select
        options:
          - { label: Startseite, value: home }
          - { label: Über uns, value: ueber-uns }
          - { label: Kontakt, value: kontakt }
          - { label: Erkrankungen (Übersicht), value: erkrankungen }
          - { label: Schönheit (Übersicht), value: schoenheit }
          - { label: Impressum, value: impressum }
          - { label: Datenschutz, value: datenschutz }
          - { label: Bildquellen, value: bildquellen }
      - { label: Titel, name: title, widget: string }
      - { label: Kurzbeschreibung (SEO), name: description, widget: text }
      - { label: Titelbild, name: heroImage, widget: image, required: false }
      - { label: Bild-Alt-Text, name: heroAlt, widget: string, required: false }
      - { label: 'Einleitungstext (nur „Über uns“)', name: intro, widget: text, required: false, hint: 'Kurze Vorstellung, erscheint im beigen Feld oben links' }
      - { label: 'Portrait neben Willkommenstext (nur Startseite)', name: sideImage, widget: image, required: false }
      - { label: 'Alt-Text Portrait (nur Startseite)', name: sideAlt, widget: string, required: false }
      - label: 'Galerie Räume (nur „Über uns“)'
        name: galleryRooms
        widget: list
        required: false
        fields:
          - { label: Bild, name: image, widget: image }
          - { label: Alt-Text, name: alt, widget: string }
      - label: 'Galerie Ärztin (nur „Über uns“)'
        name: galleryDoctor
        widget: list
        required: false
        fields:
          - { label: Bild, name: image, widget: image }
          - { label: Alt-Text, name: alt, widget: string }
      - { label: Text, name: body, widget: markdown }

  - name: seiten-en
    label: Seiten (English)
    folder: src/content/pages/en
