          - { label: Über uns, value: ueber-uns }
          - { label: Kontakt, value: kontakt }
          - { label: Erkrankungen (Übersicht), value: erkrankungen }
          - { label: Schönheit (Übersicht), value: schoenheit }
          - { label: Impressum, value: impressum }
          - { label: Datenschutz, value: datenschutz }
          - { label: Bildquellen, value: bildquellen }
      - { label: Titel (FR), name: title, widget: string }
      - { label: Kurzbeschreibung (SEO, FR), name: description, widget: text }
      - { label: Titelbild, name: heroImage, widget: image, required: false }
