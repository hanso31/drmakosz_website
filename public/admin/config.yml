          - { label: Mobil, name: phoneMobile, widget: string }
          - { label: Fax, name: fax, widget: string }
          - { label: E-Mail, name: email, widget: string }
          - label: Sprechstunden (FR)
            name: hours
            widget: list
            fields:
              - { label: Tage, name: days, widget: string }
              - { label: Uhrzeit, name: time, widget: string }
          - { label: Hinweis zu den Sprechstunden (FR), name: hoursNote, widget: text }
