    files:
      - name: praxis-de
        label: Kontakt & Sprechstunden (Deutsch)
        file: src/content/settings/de.json
        fields:
          - { label: Sprache, name: lang, widget: hidden, default: de }
          - { label: Praxisname, name: practiceName, widget: string }
          - { label: Ärztin/Arzt, name: doctorName, widget: string }
          - { label: Fachgebiet, name: specialty, widget: string }
          - { label: Strasse, name: street, widget: string }
          - { label: PLZ & Ort, name: zipCity, widget: string }
          - { label: Telefon, name: phone, widget: string }
          - { label: Mobil, name: phoneMobile, widget: string }
          - { label: Fax, name: fax, widget: string }
          - { label: E-Mail, name: email, widget: string }
          - label: Sprechstunden
            name: hours
            widget: list
            fields:
              - { label: Tage, name: days, widget: string, hint: 'z. B. „Montag bis Freitag“' }
              - { label: Uhrzeit, name: time, widget: string, hint: 'z. B. „08.00 – 13.00 Uhr“' }
          - { label: Hinweis zu den Sprechstunden, name: hoursNote, widget: text }
      - name: praxis-en
        label: Kontakt & Sprechstunden (English)
