        fields:
          - { label: Bild, name: image, widget: image }
          - { label: Alt-Text, name: alt, widget: string }
      - { label: Text (FR), name: body, widget: markdown }

  # -------------------------------------------------------------------- News
  - name: news-de
    label: Aktuelles (Deutsch)
    label_singular: Beitrag
    folder: src/content/news/de
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: Sprache, name: lang, widget: hidden, default: de }
      - { label: Titel, name: title, widget: string }
      - { label: Kurzbeschreibung, name: description, widget: text }
      - { label: Datum, name: date, widget: datetime, date_format: DD.MM.YYYY, time_format: false }
      - { label: Veröffentlicht, name: published, widget: boolean, default: false, hint: 'Erst wenn aktiv, erscheint der Beitrag auf der Website' }
      - { label: Bild, name: heroImage, widget: image, required: false }
      - { label: Bild-Alt-Text, name: heroAlt, widget: string, required: false }
      - { label: Text, name: body, widget: markdown }

